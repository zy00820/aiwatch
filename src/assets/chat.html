<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>全能AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,sans-serif;background:#f5f6f8;}
#app{display:flex;flex-direction:column;height:100%;}
.header{height:48px;background:#1890ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;flex-shrink:0;}
.chat{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;}
.msg{max-width:82%;padding:8px 10px;border-radius:10px;font-size:14px;line-height:1.4;word-wrap:break-word;}
.msg.ai{background:#fff;color:#333;align-self:flex-start;}
.msg.user{background:#1890ff;color:#fff;align-self:flex-end;}
.msg.loading{background:#e6f7ff;color:#1890ff;align-self:flex-start;}
.inputbar{display:flex;gap:6px;padding:6px;background:#fff;border-top:1px solid #e6e6e6;flex-shrink:0;}
.inputbar input{flex:1;height:36px;border-radius:8px;background:#f0f2f5;border:none;padding:0 10px;font-size:14px;outline:none;}
.inputbar button{height:36px;padding:0 12px;background:#1890ff;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;}
.inputbar button:disabled{background:#ccc;}
</style>
</head>
<body>
<div id="app">
<div class="header">全能AI</div>
<div class="chat" id="chat"></div>
<div class="inputbar">
<input id="input" type="text" placeholder="输入问题..." onkeydown="if(event.key==='Enter')send()">
<button id="sendBtn" onclick="send()">发送</button>
</div>
</div>
<script>
// ==== 配置：请填入你的智谱 API Key ====
// 注册 https://bigmodel.cn 后免费获取，GLM-4.7-Flash 永久免费
const API_KEY = '';
const API_URL = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
const MODEL = 'glm-4.7-flash';
const SYSTEM_PROMPT = '你是简洁智能助手，用尽量短的中文回答，适合手表小屏幕阅读。';

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

let history = [];

function scrollToBottom(){chat.scrollTop=chat.scrollHeight;}

function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  scrollToBottom();
  return d;
}

async function send(){
  const text = input.value.trim();
  if(!text) return;
  if(!API_KEY){
    addMsg('请先在设置中填入 API Key', 'ai');
    return;
  }
  input.value = '';
  sendBtn.disabled = true;
  addMsg(text, 'user');
  const loadingEl = addMsg('思考中...', 'loading');

  history.push({role:'user', content:text});

  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [
          {role:'system', content: SYSTEM_PROMPT},
          ...history.slice(-10)
        ],
        stream: false
      })
    });
    const data = await res.json();
    if(data.choices && data.choices[0]){
      const reply = data.choices[0].message.content;
      loadingEl.remove();
      addMsg(reply, 'ai');
      history.push({role:'assistant', content:reply});
    } else {
      loadingEl.remove();
      addMsg('请求失败：' + (data.error?.message || '未知错误'), 'ai');
    }
  } catch(e){
    loadingEl.remove();
    addMsg('网络错误，请检查：' + e.message, 'ai');
  }
  sendBtn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
